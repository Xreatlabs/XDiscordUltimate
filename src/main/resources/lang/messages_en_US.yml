discord:
  commands:
    help:
      description: Show all bot commands and features
    status:
      description: Show real-time server status with TPS and player count
    players:
      description: List all online players with their worlds
    server:
      description: Show detailed server information
    ping:
      description: Check bot latency and response time
    tps:
      description: Show server performance (TPS/MSPT)
    verify:
      description: Link your Discord account to Minecraft
    stats:
      description: View player statistics and achievements
      option-player: Player name to lookup
    console:
      description: Execute a command on the server (Admin only)
      option-command: The command to execute
    announce:
      description: Broadcast an announcement to all players
      option-message: The announcement message
      option-title: Optional title for the announcement
    online:
      description: Quick view of who's online
    info:
      description: Show plugin info and version
