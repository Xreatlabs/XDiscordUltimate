# XDiscordUltimate Messages Configuration
# ============================================
# Supports:
#   - Legacy color codes: &a, &b, &c, etc.
#   - Hex colors: &#FF5555 or <#FF5555>
#   - Gradients: <gradient:#FF0000:#0000FF>text</gradient>
#   - Rainbow: <rainbow>text</rainbow>
#   - MiniMessage tags: <bold>, <italic>, <underlined>, <strikethrough>
#   - Named colors: <red>, <green>, <blue>, <gold>, etc.
# ============================================

# General Messages
general:
  # Plugin prefix - supports gradients!
  prefix: "<gradient:#55FFFF:#5555FF>XDiscord</gradient> &8» &r"
  reload: "<gradient:#55FF55:#00AA00>Configuration reloaded successfully!</gradient>"
  reload-success: "<gradient:#55FF55:#00AA00>Configuration reloaded successfully!</gradient>"
  reload-failed: "<gradient:#FF5555:#AA0000>Failed to reload configuration.</gradient> &7Check console for errors."
  no-permission: "<gradient:#FF5555:#AA0000>You don't have permission</gradient> &7to use this command."
  player-only: "<gradient:#FFAA00:#FF5555>This command</gradient> &7can only be used by players."
  unknown-command: "&7Unknown command. Use &e/xdiscord help &7for help."

# Error Messages
errors:
  no-permission: "<gradient:#FF5555:#AA0000>Access Denied!</gradient> &7You don't have permission."
  player-not-found: "<gradient:#FF5555:#FFAA00>Player Not Found!</gradient> &7'%player%' is not online."
  invalid-usage: "<gradient:#FFAA00:#FF5555>Invalid Usage!</gradient> &7Correct: &e%usage%"
  not-verified: "<gradient:#FFAA00:#FF5555>Verification Required!</gradient> &7Use &e/verify &7to link accounts."
  already-verified: "<gradient:#55FF55:#55FFFF>Already Verified!</gradient> &7Your account is linked."
  verification-failed: "<gradient:#FF5555:#AA0000>Verification Failed!</gradient> &7Please try again."
  cooldown: "<gradient:#FFAA00:#FF5555>Cooldown!</gradient> &7Please wait before using this again."
  feature-disabled: "<gradient:#AAAAAA:#555555>Feature Disabled!</gradient> &7This feature is currently off."
  discord-not-linked: "<gradient:#5555FF:#AA00AA>Discord Required!</gradient> &7Link with &e/verify &7first."

# Success Messages
success:
  verified: "<gradient:#55FF55:#55FFFF>Success!</gradient> &7Your account is now linked to Discord!"
  ticket-created: "<gradient:#55FF55:#55FFFF>Ticket Created!</gradient> &7Check Discord for updates."
  report-sent: "<gradient:#55FF55:#00AA00>Report Submitted!</gradient> &7Moderators have been notified."
  announcement-sent: "<gradient:#FFAA00:#FF5555>Announcement Sent!</gradient> &7Broadcast complete."

# Verification Messages
verification:
  code-generated: "<gradient:#55FFFF:#5555FF>Verification Code</gradient> &8» &e&l%code%"
  code-expired: "<gradient:#FF5555:#AA0000>Code Expired!</gradient> &7Generate a new one."
  code-invalid: "<gradient:#FF5555:#FFAA00>Invalid Code!</gradient> &7Check and try again."
  instructions: "&7Use this code in Discord with &e/verify &7to link."
  already-linked: "<gradient:#FFAA00:#FF5555>Already Linked!</gradient> &7This Discord is linked to another account."
  already-verified: "<gradient:#55FF55:#55FFFF>Already Verified!</gradient> &7Your account is linked."
  success: "<gradient:#55FF55:#55FFFF>Verification Complete!</gradient> &7Accounts are now linked!"
  required: "<gradient:#FFAA00:#FF5555>Verification Required!</gradient> &7Link your Discord account."
  kick-message: "<gradient:#FF5555:#AA0000>Verification Required!</gradient>\n&7You must verify within &e%minutes% &7minutes!"

# Ticket Messages
tickets:
  created: "<gradient:#55FFFF:#5555FF>Ticket #%id%</gradient> &7created! Staff will assist soon."
  closed: "<gradient:#AAAAAA:#555555>Ticket #%id%</gradient> &7has been closed."
  not-found: "<gradient:#FF5555:#AA0000>Not Found!</gradient> &7Ticket does not exist."
  max-tickets: "<gradient:#FFAA00:#FF5555>Limit Reached!</gradient> &7Max open tickets reached."

# Support Messages
support:
  no-message: "<gradient:#FF5555:#FFAA00>Missing Message!</gradient> &7Provide a message for your ticket."
  created: "<gradient:#55FF55:#55FFFF>Support Ticket Created!</gradient> &7Check Discord."

# Report Messages
report:
  success: "<gradient:#55FF55:#00AA00>Report #%id%</gradient> &7against &e%player% &7submitted!"
  cooldown: "<gradient:#FFAA00:#FF5555>Cooldown!</gradient> &7Wait before reporting again."
  self-report: "<gradient:#FF5555:#AA0000>Error!</gradient> &7You cannot report yourself!"

# Announcement Messages
announcement:
  no-message: "<gradient:#FF5555:#FFAA00>Missing Message!</gradient> &7Provide announcement content."
  sent: "<gradient:#55FF55:#55FFFF>Announcement Sent!</gradient> &7Broadcast to all platforms."

# Chat Messages
chat:
  discord-to-minecraft: "&8[<gradient:#5555FF:#7289DA>Discord</gradient>&8] &b%user%&8: &f%message%"
  minecraft-to-discord: "**%player%**: %message%"
  filtered: "<gradient:#FF5555:#AA0000>Message Blocked!</gradient> &7Chat filter activated."
  spam-warning: "<gradient:#FFAA00:#FF5555>Slow Down!</gradient> &7Don't spam the chat."

# Join/Leave Messages
events:
  player-join: "<gradient:#55FF55:#55FFFF>+</gradient> &7%player% joined"
  player-leave: "<gradient:#FF5555:#FFAA00>-</gradient> &7%player% left"
  first-join: "<rainbow>Welcome!</rainbow> &e%player% &7joined for the first time!"

# Stats Messages
stats:
  header: "<gradient:#FFAA00:#FF5555>━━━ %player%'s Stats ━━━</gradient>"
  kills: "&8▸ <gradient:#FF5555:#FFAA00>Kills</gradient>&8: &f%value%"
  deaths: "&8▸ <gradient:#AAAAAA:#555555>Deaths</gradient>&8: &f%value%"
  kd-ratio: "&8▸ <gradient:#55FFFF:#5555FF>K/D Ratio</gradient>&8: &f%value%"
  mob-kills: "&8▸ <gradient:#55FF55:#00AA00>Mob Kills</gradient>&8: &f%value%"
  playtime: "&8▸ <gradient:#AA00AA:#FF55FF>Playtime</gradient>&8: &f%value%"
  not-found: "<gradient:#FF5555:#AA0000>Not Found!</gradient> &7Player stats unavailable."

# Moderation Messages
moderation:
  ban-success: "<gradient:#FF5555:#AA0000>Banned!</gradient> &e%player% &7has been banned."
  kick-success: "<gradient:#FFAA00:#FF5555>Kicked!</gradient> &e%player% &7has been kicked."
  mute-success: "<gradient:#AAAAAA:#555555>Muted!</gradient> &e%player% &7has been muted."
  unmute-success: "<gradient:#55FF55:#55FFFF>Unmuted!</gradient> &e%player% &7can speak again."
  warn-success: "<gradient:#FFAA00:#FF5555>Warned!</gradient> &e%player% &7has been warned."

# Help Messages
help:
  header:
    - ""
    - "<gradient:#55FFFF:#5555FF>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient>"
    - "       <gradient:#55FFFF:#5555FF>&lXDiscordUltimate</gradient> &8- &7Help"
    - "<gradient:#55FFFF:#5555FF>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient>"
    - ""
  footer:
    - ""
    - "<gradient:#55FFFF:#5555FF>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient>"
    - "  &7Use <gradient:#55FFFF:#5555FF>/xdiscord help</gradient> &7for commands"
    - "<gradient:#55FFFF:#5555FF>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient>"
    - ""
  verify: "  <gradient:#55FF55:#55FFFF>▸</gradient> &e/verify &8- &7Link Discord account"
  support: "  <gradient:#55FF55:#55FFFF>▸</gradient> &e/support <msg> &8- &7Create ticket"
  stats: "  <gradient:#55FF55:#55FFFF>▸</gradient> &e/stats [player] &8- &7View statistics"
  report: "  <gradient:#55FF55:#55FFFF>▸</gradient> &e/report <player> <reason> &8- &7Report player"
  help: "  <gradient:#55FF55:#55FFFF>▸</gradient> &e/help &8- &7Show this menu"

# Command Descriptions
commands:
  verify: "Link your Discord account with Minecraft"
  support: "Create a support ticket for staff assistance"
  embed: "Send a custom embed message to Discord"
  announce: "Broadcast an announcement to Discord and in-game"

# Server Control Messages
server-control:
  restart-scheduled: "<gradient:#FF5555:#FFAA00>Server Restart</gradient> &7in &e%time% &7seconds!"
  stopping: "<gradient:#FF5555:#AA0000>Server Stopping...</gradient> &7See you soon!"
