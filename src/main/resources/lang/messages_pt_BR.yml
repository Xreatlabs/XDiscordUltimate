discord:
  commands:
    help:
      description: Mostrar todos os comandos e recursos do bot
    status:
      description: Mostrar status do servidor em tempo real com TPS e contagem de jogadores
    players:
      description: Listar todos os jogadores online com seus mundos
    server:
      description: Mostrar informações detalhadas do servidor
    ping:
      description: Verificar latência do bot e tempo de resposta
    tps:
      description: Mostrar desempenho do servidor (TPS/MSPT)
    verify:
      description: Vincule sua conta do Discord ao Minecraft
    stats:
      description: Ver estatísticas e conquistas dos jogadores
      option-player: Nome do jogador para procurar
    console:
      description: Executar um comando no servidor (Apenas Admin)
      option-command: O comando a executar
    announce:
      description: Transmitir um anúncio para todos os jogadores
      option-message: A mensagem do anúncio
      option-title: Título opcional para o anúncio
    online:
      description: Visão rápida de quem está online
    info:
      description: Mostrar informações e versão do plugin
