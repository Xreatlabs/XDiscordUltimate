plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

// Load .env file for webhook URL
def envFile = file('.env')
def webhookUrl = ''
if (envFile.exists()) {
    envFile.eachLine { line ->
        if (line.startsWith('DISCORD_WEBHOOK_URL=')) {
            webhookUrl = line.substring('DISCORD_WEBHOOK_URL='.length()).trim()
        }
    }
}

group = 'com.xreatlabs.xdiscordultimate'
version = '1.2.0'

// Java 16+ for 1.17+, Java 17+ for 1.18+
// We compile with Java 16 for maximum compatibility (1.16.5-1.21.x)
java {
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16
}

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url 'https://papermc.io/repo/repository/maven-public/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://nexus.scarsz.me/content/groups/public/' }
    maven { url 'https://repo.alessiodp.com/releases/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'me.clip:placeholderapi:2.11.3'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'

    // Libby for runtime dependency management
    implementation 'net.byteflux:libby-bukkit:1.3.1'

    // All other dependencies as compileOnly for runtime loading
    compileOnly 'net.dv8tion:JDA:5.0.0-beta.18'
    compileOnly 'com.squareup.okhttp3:okhttp:4.10.0'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'com.zaxxer:HikariCP:5.0.1'
    compileOnly 'org.xerial:sqlite-jdbc:3.42.0.0'
    compileOnly 'com.mysql:mysql-connector-j:8.0.33'
    compileOnly 'org.postgresql:postgresql:42.6.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
    // Log4j is provided by the server at runtime. Keep these compile-only for the types we use,
    // but do NOT load them via Libby to avoid SLF4J binding conflicts.
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.1'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.17.1'

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.42.0.0'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName.set('XDiscordUltimate')
    archiveClassifier.set('')
    archiveVersion.set(version)
}

jar {
    archiveBaseName.set('XDiscordUltimate')
    archiveVersion.set(version)
}

build.dependsOn shadowJar

// Task to upload JAR to Discord webhook
task uploadToDiscord(type: Exec) {
    dependsOn shadowJar
    
    def jarFile = file("build/libs/XDiscordUltimate-${version}.jar")
    def url = webhookUrl
    
    onlyIf {
        if (!url) {
            println "⚠️  No Discord webhook URL found in .env file. Skipping upload."
            return false
        }
        return true
    }
    
    doFirst {
        println "📤 Uploading JAR to Discord..."
    }
    
    commandLine 'curl', '-s', '-F', "content=✅ **Build Complete!** New JAR file ready:", 
                '-F', "file=@${jarFile.absolutePath}",
                url
    
    doLast {
        println "✅ JAR uploaded to Discord successfully!"
    }
}

// Automatically upload after build
build.finalizedBy uploadToDiscord